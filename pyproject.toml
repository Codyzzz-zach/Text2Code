[project]
name = "text2code"
version = "0.6.0"
description = "Text2Code — transform natural language into executable Knowledge Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "anthropic>=0.30",
]

[project.scripts]
t2c = "t2c.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["t2c*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
